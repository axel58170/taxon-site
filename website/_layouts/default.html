<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <title>{{ page.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Taxon Bridge home">
      <img src="{{ '/assets/app-icon.png' | relative_url }}" alt="" width="40" height="40">
      <span>Taxon Bridge</span>
    </a>
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="{{ '/privacy/' | relative_url }}"{% if page.current_nav == 'privacy' %} aria-current="page"{% endif %}>Privacy</a></li>
        <li><a href="{{ '/support/' | relative_url }}"{% if page.current_nav == 'support' %} aria-current="page"{% endif %}>Support</a></li>
      </ul>
    </nav>
  </header>

  <main id="main"{% if page.document %} class="document"{% endif %}>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Taxon Bridge</p>
    <p>{% if page.footer_link == 'privacy' %}<a href="{{ '/privacy/' | relative_url }}">Privacy</a>{% elsif page.footer_link == 'support' %}<a href="{{ '/support/' | relative_url }}">Support</a>{% else %}<a href="mailto:taxon@axelgraff.fr">taxon@axelgraff.fr</a>{% endif %}</p>
  </footer>
</body>
</html>
